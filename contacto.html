
<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Contacto - CFSFV</title>
</head>

<body>

    <header>
        <nav>
            <a href="index.html">Índice</a>
            <a href="Futsal.html">Fútbol sala</a>
            <a href="ricardinho.html">Ricardinho</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <main>

        <h1>Contacto</h1>

        <p>
            Aquí tienes un formulario que debes rellenar en caso
            de querer unirte a mi club (CFSFV).
        </p>

        <form>

            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>

            <br>
            <br>

            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" required>

            <br>
            <br>

            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad" min="5" max="100" required>

            <br>
            <br>

            <label for="acepto">
                Acepto formar parte del club:
            </label>
            <input type="checkbox" id="acepto" name="acepto" value="si" required>

            <br>
            <br>

            <label for="mensaje">
                Escribe alguna duda que tengas sobre información,
                derechos, equipaciones, etc.
            </label>

            <br>
            <br>

            <textarea
                id="mensaje"
                name="mensaje"
                cols="40"
                rows="10"
                placeholder="Escribe aquí tu mensaje..."
            ></textarea>

            <br>
            <br>

            <button type="submit">Enviar</button>

        </form>

        <hr>

        <p>
            Aquí tienes un enlace que te lleva a su página oficial
            de Instagram.
        </p>

        <a
            href="https://www.instagram.com/cfsfvilamarxant/"
            target="_blank"
            rel="noopener noreferrer"
        >
            Instagram CFSFV
        </a>

        <br>
        <br>

        <img
            src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fpbs.twimg.com%2Fprofile_banners%2F597686144%2F1680850411&f=1&nofb=1&ipt=3924c9814951878d0de67cd3de3a56c33665bbc2c7bdfdeb920a03cf0e74ccce&ipo=images"
            alt="Imagen del club CFSFV"
            width="500"
        >

    </main>

    <footer>
        <p>Página creada para la asignatura de informática - 2026</p>
    </footer>

</body>
</html>
